[package]
name = "crusty-core"
version = "0.1.0"
edition = "2021"
authors = ["Newid"]
description = "Framework-agnostic core for Crusty: audio engine, queue, downloads, config/state"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
dirs = "5.0"
tempfile = "3.10"
tokio = { version = "1.35", features = ["rt", "sync", "macros"] }

# Audio playback (engine module)
rodio = "0.22"
# Lock-free command channel: Sender is Send + Sync, recv_timeout drives the loop
crossbeam-channel = "0.5"

# MPRIS2 D-Bus media-player interface (optional, `mpris` feature).
# Serves Waybar, Quickshell (Quickshell.Services.Mpris), and playerctl.
mpris-server = { version = "0.9", optional = true }

[features]
# Off by default to keep core lean / portable; enabled by crusty-tui (default-on
# there) and the future GUI. The bridge degrades gracefully if no session bus.
mpris = ["dep:mpris-server"]

[dev-dependencies]
